# CI for SaaS Growth Marketing Skills.
#
# test        on every push to main, every pull request, weekly and on demand:
#             synced copies match shared/growthkit, repo lint, offline unit
#             tests. Python 3.9 is the floor (stock macOS python3) and 3.12 a
#             current release.
# smoke-live  weekly and on demand only: fetches 3 real SaaS homepages with
#             growthkit. Warn-only, it never fails the build.
#
# Run the same checks locally from the repo root:
#   python3 tools/sync_shared.py --check
#   python3 tools/lint_repo.py
#   python3 -m unittest discover -s tests -t .

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC (off the hour, when GitHub's scheduler is less busy).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run on the same branch; scheduled runs have
# their own group so a push never cancels the weekly smoke test.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    # Pinned instead of ubuntu-latest: Python 3.9 is past end of life, and
    # setup-python may not publish 3.9 builds for newer runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Synced growthkit copies match shared/growthkit
        run: python tools/sync_shared.py --check

      - name: Repo lint
        run: python tools/lint_repo.py

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t .

  smoke-live:
    name: live smoke test (warn-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Belt and braces: smoke_live.py already exits 0 on warnings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Live smoke test against 3 sites
        run: python tools/smoke_live.py
