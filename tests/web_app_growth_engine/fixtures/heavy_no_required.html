<!doctype html><html lang="en"><head><title>Sign up</title></head><body>
<form action="/register" id="signup">
<input type="text" name="first_name" placeholder="First name">
<input type="text" name="last_name" placeholder="Last name">
<input type="email" name="email" placeholder="Work email">
<input type="tel" name="phone" placeholder="Phone">
<input type="text" name="company" placeholder="Company">
<select name="company_size"><option>1-10</option><option>11-50</option></select>
<select name="country"><option>US</option></select>
<input type="password" name="pw">
<input type="text" name="pan" placeholder="Card number" autocomplete="off">
<button type="submit">Start your 14-day trial</button>
</form>
<p>Your data is secure. Visit https://example.com.</p>
</body></html>
